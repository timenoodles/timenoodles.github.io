{{ define "main" }}
  {{ .Content }}
  <table class="time-list">
    <tbody>
      {{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
      <tr>
        <td class="time-list__date">{{ partial "date" .Date }}</td>
        <td class="time-list__title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></td>
      </tr>
      {{ end }}
    </tbody>
  </table>
  <div class="terminal-nav">
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="/posts/">Archive</a></li>
        <li><a href="https://shibahama.substack.com" target="_blank" rel="noopener noreferrer">Substack</a></li>
        <li><a href="/lists/">Lists</a></li>
        <li><a href="/about/">Contact</a></li>
      </ul>
    </nav>
  </div>
{{ end }}
