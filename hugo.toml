baseURL = 'https://timenoodles.github.io/'
locale = 'en-us'
title = 'Kenji'
theme = 'shibui'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = "algol_nu"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[taxonomies]
  tag = "tags"

[params]
  description = ""
  comments = false
  showtoc = true
  showreadingtime = true
  showlastmod = false

[params.author]
  name = "Kenji"

[menu]
  [[menu.main]]
    name = "Archive"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Contact"
    url = "/about/"
    weight = 2
